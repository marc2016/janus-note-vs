<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="520" height="180" rx="12" fill="#f6f8fa"/>
  <g fill="#ffffff" stroke="#3b82f6" stroke-width="2">
    <rect x="24" y="60" width="130" height="60" rx="8"/>
    <rect x="195" y="60" width="130" height="60" rx="8"/>
    <rect x="366" y="60" width="130" height="60" rx="8"/>
  </g>
  <g fill="#1f2937" text-anchor="middle">
    <text x="89" y="95">Mobile Client</text>
    <text x="260" y="95">Sync-Gateway</text>
    <text x="431" y="95">PostgreSQL</text>
  </g>
  <g stroke="#3fb950" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="156" y1="90" x2="191" y2="90"/>
    <line x1="327" y1="90" x2="362" y2="90"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>

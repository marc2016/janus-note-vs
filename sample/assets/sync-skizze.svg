  </defs>
  <text x="260" y="38" text-anchor="middle" fill="#6b7280" font-size="13">Delta-Sync über WebSockets (Skizze)</text>
  <text x="260" y="150" text-anchor="middle" fill="#6b7280" font-size="12">Offline-Änderungen werden lokal in SQLite gepuffert</text>
</svg>

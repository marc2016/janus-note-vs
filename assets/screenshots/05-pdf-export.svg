<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect x="20" y="20" width="960" height="560" rx="10" fill="#1e1e1e" stroke="#333333" stroke-width="1.5" filter="url(#shadow5)" />

  <!-- Dialog Modal Header -->
  <g transform="translate(60, 48)">
    <text x="0" y="20" fill="#888888" font-size="12" font-weight="600">DRUCK- &amp; PDF-EXPORT</text>
    <text x="0" y="52" fill="#ffffff" font-size="24" font-weight="bold">📄 Notizensammlung als PDF exportieren</text>
    <text x="0" y="76" fill="#aaaaaa" font-size="12.5">
      Kompiliert mehrere ausgewählte Notizen in ein zusammenhängendes, druckfertiges Vektor-PDF Dokument.
    </text>
  </g>

  <!-- Left: Export Configuration Box (Width: 420px) -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="410" height="340" rx="8" fill="#252528" stroke="#38383a" />
    
    <!-- Title Input -->
    <g transform="translate(20, 20)">
      <text x="0" y="14" fill="#ffffff" font-size="12" font-weight="600">Dokument-Titel</text>
      <rect x="0" y="24" width="370" height="34" rx="4" fill="#3c3c3c" stroke="#555" />
      <text x="12" y="46" fill="#ffffff" font-size="12">App-Launch Dokumentation 2026</text>
    </g>

    <!-- Table of Contents Toggle (Checkbox) -->
    <g transform="translate(20, 100)">
      <rect x="0" y="0" width="20" height="20" rx="4" fill="#007acc" stroke="#007acc" />
      <path d="M4 10 L8 14 L15 5" fill="none" stroke="#fff" stroke-width="2" />
      <text x="30" y="15" fill="#ffffff" font-size="12.5" font-weight="600">Inhaltsverzeichnis generieren</text>
      <text x="30" y="34" fill="#aaaaaa" font-size="11">Erstellt eine Deckblatt-Übersicht mit klickbaren internen Sprungmarken.</text>
    </g>

    <!-- Layout & Formatting Notes -->
    <g transform="translate(20, 160)">
      <text x="0" y="14" fill="#ffffff" font-size="12" font-weight="600">Druck-Einstellungen</text>
      <text x="0" y="36" fill="#cccccc" font-size="11.5">• Seitenformat: <tspan fill="#ffffff" font-weight="bold">DIN A4</tspan> (20mm Randabstand)</text>
      <text x="0" y="56" fill="#cccccc" font-size="11.5">• Seitenumbrüche: <tspan fill="#ffffff" font-weight="bold">Saubere Trennung</tspan> vor jeder Notiz</text>
      <text x="0" y="76" fill="#cccccc" font-size="11.5">• Grafiken: <tspan fill="#ffffff" font-weight="bold">Inline SVG Mermaid</tspan> &amp; relative Bilder</text>
      <text x="0" y="96" fill="#cccccc" font-size="11.5">• Engine: <tspan fill="#ffffff" font-weight="bold">Headless Chromium</tspan> (Chrome, Edge, Brave)</text>
    </g>
  </g>

  <!-- Right: Note Sequence & Reorder List (Width: 440px) -->
  <g transform="translate(500, 140)">
    <rect x="0" y="0" width="440" height="340" rx="8" fill="#252528" stroke="#38383a" />
    <text x="20" y="26" fill="#ffffff" font-size="13" font-weight="bold">Reihenfolge der Notizen festlegen <tspan fill="#888888">(3 Notizen)</tspan></text>

    <!-- Note Item 1 (Selected/Reorderable) -->
    <g transform="translate(16, 44)">
      <rect x="0" y="0" width="408" height="60" rx="6" fill="#1e1e1e" stroke="#38383a" />
      <text x="12" y="24" fill="#3794ff" font-size="12" font-weight="bold">1. kickoff.md</text>
      <text x="12" y="44" fill="#888888" font-size="10.5">projects/App-Launch/kickoff.md</text>
      <!-- Move Up/Down buttons -->
      <rect x="330" y="15" width="28" height="28" rx="4" fill="#2d2d2d" stroke="#444" opacity="0.4" />
      <text x="339" y="34" fill="#888" font-size="13">▲</text>
      <rect x="364" y="15" width="28" height="28" rx="4" fill="#3a3d41" stroke="#555" />
      <text x="373" y="34" fill="#fff" font-size="13">▼</text>
    </g>

    <!-- Note Item 2 -->
    <g transform="translate(16, 114)">
      <rect x="0" y="0" width="408" height="60" rx="6" fill="#1e1e1e" stroke="#007acc" stroke-width="1.5" />
      <text x="12" y="24" fill="#3794ff" font-size="12" font-weight="bold">2. project-plan.md</text>
      <text x="12" y="44" fill="#888888" font-size="10.5">projects/App-Launch/project-plan.md</text>
      <!-- Move Up/Down buttons -->
      <rect x="330" y="15" width="28" height="28" rx="4" fill="#3a3d41" stroke="#555" />
      <text x="339" y="34" fill="#fff" font-size="13">▲</text>
      <rect x="364" y="15" width="28" height="28" rx="4" fill="#3a3d41" stroke="#555" />
      <text x="373" y="34" fill="#fff" font-size="13">▼</text>
    </g>

    <!-- Note Item 3 -->
    <g transform="translate(16, 184)">
      <rect x="0" y="0" width="408" height="60" rx="6" fill="#1e1e1e" stroke="#38383a" />
      <text x="12" y="24" fill="#3794ff" font-size="12" font-weight="bold">3. architecture.md</text>
      <text x="12" y="44" fill="#888888" font-size="10.5">knowledge/architecture.md</text>
      <!-- Move Up/Down buttons -->
      <rect x="330" y="15" width="28" height="28" rx="4" fill="#3a3d41" stroke="#555" />
      <text x="339" y="34" fill="#fff" font-size="13">▲</text>
      <rect x="364" y="15" width="28" height="28" rx="4" fill="#2d2d2d" stroke="#444" opacity="0.4" />
      <text x="373" y="34" fill="#888" font-size="13">▼</text>
    </g>
  </g>

  <!-- Dialog Bottom Bar: Cancel & Export Buttons -->
  <g transform="translate(680, 506)">
    <rect x="0" y="0" width="100" height="34" rx="4" fill="#2d2d2d" stroke="#555" />
    <text x="18" y="22" fill="#cccccc" font-size="12" font-weight="600">Abbrechen</text>

    <rect x="115" y="0" width="180" height="34" rx="4" fill="#007acc" />
    <text x="135" y="22" fill="#ffffff" font-size="12.5" font-weight="bold">Als PDF exportieren...</text>
  </g>
</svg>


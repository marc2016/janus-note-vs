<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="janusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007acc" />
      <stop offset="50%" stop-color="#0e639c" />
      <stop offset="100%" stop-color="#1177bb" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cca700" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#007acc" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#1e1e1e" stroke="#333333" stroke-width="2" filter="url(#shadow)" />
  <rect x="12" y="12" width="104" height="104" rx="24" fill="url(#janusGrad)" opacity="0.15" />

  <!-- Dual Perspective Book / Metaphor -->
  <!-- Left Side: Human Note (Lines & Clean Layout) -->
  <path d="M28 32 C28 26, 34 24, 60 24 L60 104 C34 104, 28 102, 28 96 Z" fill="#252526" stroke="#007acc" stroke-width="2.5" />
  <line x1="36" y1="42" x2="52" y2="42" stroke="#d4d4d4" stroke-width="2.5" stroke-linecap="round" />
  <line x1="36" y1="54" x2="52" y2="54" stroke="#858585" stroke-width="2" stroke-linecap="round" />
  <line x1="36" y1="66" x2="48" y2="66" stroke="#858585" stroke-width="2" stroke-linecap="round" />
  <circle cx="38" cy="80" r="3" fill="#cca700" />
  <line x1="45" y1="80" x2="52" y2="80" stroke="#858585" stroke-width="2" stroke-linecap="round" />

  <!-- Center Spine Divider -->
  <line x1="64" y1="20" x2="64" y2="108" stroke="#007acc" stroke-width="3" stroke-linecap="round" />

  <!-- Right Side: Machine Companion (JSON & Diagram Node graph) -->
  <path d="M100 32 C100 26, 94 24, 68 24 L68 104 C94 104, 100 102, 100 96 Z" fill="#2d2d30" stroke="#007acc" stroke-width="2.5" />
  <!-- JSON curly brackets & code symbols -->
  <text x="74" y="46" font-family="monospace" font-size="14" font-weight="bold" fill="#388bfd">{</text>
  <rect x="80" y="52" width="12" height="6" rx="2" fill="#238636" />
  <circle cx="78" cy="72" r="4" fill="#8957e5" />
  <line x1="82" y1="72" x2="92" y2="72" stroke="#8957e5" stroke-width="1.5" />
  <circle cx="94" cy="72" r="3" fill="#388bfd" />
  <text x="74" y="92" font-family="monospace" font-size="14" font-weight="bold" fill="#388bfd">}</text>

  <!-- Sparkle Accent -->
  <polygon points="104,18 106,24 112,26 106,28 104,34 102,28 96,26 102,24" fill="#cca700" />
</svg>

